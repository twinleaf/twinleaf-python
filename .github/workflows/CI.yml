name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Ruff lint
        run: uvx ruff@0.15.10 check
      - name: Ruff format
        run: uvx ruff@0.15.10 format --check
      - name: Type check (ty)
        run: uvx --with ipython ty@0.0.30 check

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y systemd-devel; fi
            if command -v apt-get >/dev/null; then apt-get update && apt-get install -y libudev-dev; fi
            if command -v apk >/dev/null; then apk add --no-cache eudev-dev; fi
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
          before-script-linux: |
            if command -v yum >/dev/null; then yum install -y systemd-devel; fi
            if command -v apt-get >/dev/null; then apt-get update && apt-get install -y libudev-dev; fi
            if command -v apk >/dev/null; then apk add --no-cache eudev-dev; fi
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
          - runner: macos-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      # The two steps below are hand-written; `maturin generate-ci github` will
      # drop them if the workflow is ever regenerated. macOS 27's dyld refuses to
      # load a Mach-O whose LINKEDIT string pool is not 8-byte aligned, and a
      # wheel can carry that defect off a runner that loads it happily.
      - name: Check LINKEDIT alignment
        run: |
          python3 - dist/*.whl <<'PY'
          import struct, sys, zipfile

          def slices(buf):
              magic, = struct.unpack_from(">I", buf, 0)
              if magic in (0xCAFEBABE, 0xCAFEBABF):          # universal binary
                  nfat, = struct.unpack_from(">I", buf, 4)
                  step, fmt = (32, ">2I2Q") if magic == 0xCAFEBABF else (20, ">5I")
                  for i in range(nfat):
                      yield buf[struct.unpack_from(fmt, buf, 8 + i * step)[2]:]
              else:
                  yield buf

          def string_pool_offset(sl):
              if struct.unpack_from("<I", sl, 0)[0] != 0xFEEDFACF:
                  return None                                # not 64-bit little-endian Mach-O
              ncmds, = struct.unpack_from("<I", sl, 16)
              pos = 32
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from("<2I", sl, pos)
                  if cmd == 0x2:                             # LC_SYMTAB
                      return struct.unpack_from("<4I", sl, pos + 8)[2]
                  pos += size
              return None

          bad = checked = 0
          for wheel in sys.argv[1:]:
              with zipfile.ZipFile(wheel) as whl:
                  for name in (n for n in whl.namelist() if n.endswith(".so")):
                      for sl in slices(whl.read(name)):
                          off = string_pool_offset(sl)
                          if off is None:
                              continue
                          checked += 1
                          bad += off % 8 != 0
                          state = "ok" if off % 8 == 0 else "MIS-ALIGNED"
                          print(f"{state:>11}  {name}  string pool at 0x{off:X}")
          if bad:
              sys.exit(f"{bad} mis-aligned LINKEDIT string pool(s); macOS 27 will refuse to load these")
          if not checked:
              sys.exit("no Mach-O extension modules found to check")
          print(f"all {checked} extension module(s) 8-byte aligned")
          PY
      - name: Import the built wheel
        # macos-latest runners are arm64, so only the native wheel is loadable here.
        if: matrix.platform.target == 'aarch64'
        run: |
          python -m pip install --force-reinstall --no-deps --no-index --find-links dist twinleaf
          python -c "import twinleaf; print(twinleaf.__file__)"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [lint, linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
