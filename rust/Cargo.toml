[package]
name = "twinleaf-python"
version = "0.4.0"
edition = "2021"

[lib]
name = "_twinleaf"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-log = "0.13"
# Local checkout of the mdns branch (2.0); switch to a crates.io version once
# twinleaf 2.0 is published.
twinleaf = { path = "../../twinleaf-rust/twinleaf" }

[profile.release]
# macOS 27's dyld rejects a Mach-O whose LINKEDIT string pool is not 8-byte
# aligned ("mis-aligned LINKEDIT string pool"). Cargo's default release
# setting of strip = "debuginfo" produces exactly that for this crate.
strip = false
